<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRIMA — Music Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="top">
    <div class="wordmark">
      <span class="s s-circle"></span><span class="s s-square"></span><span class="s s-tri"></span>
      <span class="wm-text">PRIMA</span>
    </div>
    <p class="hint">SPACE play · ←/→ seek · ↑/↓ volume · N/P skip · S shuffle · R repeat</p>
  </header>

  <main class="player">

    <section class="art-block" aria-label="Cover art">
      <canvas id="art" width="640" height="640"></canvas>
    </section>

    <section class="info-block">
      <div class="vinyl-wrap" aria-hidden="true">
        <div class="vinyl"><div class="label"></div></div>
      </div>
      <div class="info-text">
        <p class="eyebrow"><i class="dot"></i><span id="status">Nothing playing</span></p>
        <h1 id="title">Drop some sound</h1>
        <p class="sub" id="sub">Load audio files to begin</p>
      </div>
    </section>

    <section class="viz-block" aria-hidden="true">
      <span class="viz-tag">SPECTRUM</span>
      <canvas id="viz"></canvas>
    </section>

    <section class="controls-block">
      <div class="progress-row">
        <span id="tCur">0:00</span>
        <div class="progress" id="progress" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="fill" id="fill"></div>
          <div class="head" id="head"></div>
        </div>
        <span id="tDur">0:00</span>
      </div>

      <div class="buttons">
        <div class="group modes">
          <button class="btn" id="shuffle" aria-label="Shuffle" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M3 6h4l10 12h4"/><path d="M3 18h4l3-3.5"/><path d="M14 9.5 17 6h4"/><path d="M18 3l3 3-3 3"/><path d="M18 15l3 3-3 3"/></svg>
          </button>
          <button class="btn" id="repeat" aria-label="Repeat: off" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M4 11V9a3 3 0 0 1 3-3h13"/><path d="M17 3l3 3-3 3"/><path d="M20 13v2a3 3 0 0 1-3 3H4"/><path d="M7 21l-3-3 3-3"/></svg>
            <span class="badge" id="repeatBadge"></span>
          </button>
        </div>

        <div class="group transport">
          <button class="btn sq" id="prev" aria-label="Previous track">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="3.5" height="16"/><path d="M21 4v16L8 12z"/></svg>
          </button>
          <button class="btn play" id="play" aria-label="Play">
            <svg viewBox="0 0 24 24">
              <path class="i-play" d="M7 4v16l14-8z"/>
              <g class="i-pause"><rect x="5" y="4" width="5" height="16"/><rect x="14" y="4" width="5" height="16"/></g>
            </svg>
          </button>
          <button class="btn sq" id="next" aria-label="Next track">
            <svg viewBox="0 0 24 24"><rect x="17.5" y="4" width="3.5" height="16"/><path d="M3 4v16l13-8z"/></svg>
          </button>
        </div>

        <div class="group volume-group">
          <button class="btn small" id="mute" aria-label="Mute">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square">
              <path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor" stroke="none"/>
              <path class="waves" d="M16 8.5a5 5 0 0 1 0 7"/>
              <path class="waves" d="M18.5 5.5a9 9 0 0 1 0 13"/>
              <path class="cross" d="M16 9l6 6M22 9l-6 6"/>
            </svg>
          </button>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
        </div>
      </div>
    </section>

  </main>

  <aside class="queue" aria-label="Queue">
    <div class="queue-head">
      <h2>QUEUE <small id="count">0 TRACKS</small></h2>
      <button class="load-btn" data-load>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="10" y="3" width="4" height="18"/><rect x="3" y="10" width="18" height="4"/></svg>
        Load
      </button>
    </div>
    <ul class="list" id="list">
      <li class="empty" id="empty">
        <div class="shapes"><i class="s s-circle"></i><i class="s s-square"></i><i class="s s-tri"></i></div>
        <p>Drop audio files anywhere on this page, or pick them from your device. MP3, WAV, OGG, M4A and FLAC all work.</p>
        <button class="cta" data-load>Choose files</button>
      </li>
    </ul>
  </aside>

</div>

<div class="drop" aria-hidden="true"><div>DROP TO ADD</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac,.aac,.opus" multiple hidden>
<audio id="audio" preload="metadata"></audio>

<script src="script.js"></script>
</body>
</html>
